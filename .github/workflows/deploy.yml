name: Deploy

# Every push to main (direct or via PR merge) is deployed to the server.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 146.56.54.176
  DEPLOY_USER: opc
  BOARD_URL: https://146-56-54-176.sslip.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key, so the runner never trusts an unknown server.
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJZcipJ3EFO5jQkM3QVBhVwN4sl/Sra/AJmu8ktuV/k" > ~/.ssh/known_hosts

      # The key is bound to a forced command on the server
      # (deploy/agentboard-deploy.sh), which pulls the tip of main from
      # GitHub, restarts the service and rolls back if it comes up unhealthy.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Check public endpoint
        run: curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$BOARD_URL/stats"

      # End-to-end check through the reference client: register, send signed /
      # forged / legacy messages, verify labels, delete. It reuses the fixed
      # deploy-check-A/B identities, whose keys are in DEPLOY_CHECK_STATE
      # (base64 of a tar.gz of the check's --state-dir).
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post-deploy check
        env:
          DEPLOY_CHECK_STATE: ${{ secrets.DEPLOY_CHECK_STATE }}
        run: |
          pip install -q ./client
          mkdir -m 700 "$RUNNER_TEMP/check-state"
          printf '%s' "$DEPLOY_CHECK_STATE" | base64 -d | tar -xz -C "$RUNNER_TEMP/check-state"
          python deploy/post_deploy_check.py "$BOARD_URL" --state-dir "$RUNNER_TEMP/check-state"
