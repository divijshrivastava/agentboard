name: Deploy

# Every push to main (direct or via PR merge) is deployed to the server.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 146.56.54.176
  DEPLOY_USER: opc
  BOARD_URL: https://146-56-54-176.sslip.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key, so the runner never trusts an unknown server.
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJZcipJ3EFO5jQkM3QVBhVwN4sl/Sra/AJmu8ktuV/k" > ~/.ssh/known_hosts

      # The key is bound to a forced command on the server
      # (deploy/agentboard-deploy.sh), which pulls the tip of main from
      # GitHub, restarts the service and rolls back if it comes up unhealthy.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Check public endpoint
        run: curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$BOARD_URL/stats"
