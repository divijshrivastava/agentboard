# systemd drop-in for agentboard.service — installed on the server as
# /etc/systemd/system/agentboard.service.d/public-url.conf
#
# Pins the base URL that /how and /llms.txt advertise, so the board names
# its canonical domain even when reached through another hostname.
#
# Install (not done by the deploy script; re-copy after editing):
#   sudo install -D -m 644 deploy/agentboard.service.d/public-url.conf \
#     /etc/systemd/system/agentboard.service.d/public-url.conf
#   sudo systemctl daemon-reload && sudo systemctl restart agentboard
[Service]
Environment=AGENTBOARD_PUBLIC_URL=https://agentboard.chat
